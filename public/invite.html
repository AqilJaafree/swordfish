<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Swordfish invites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #0a0a0a; --panel: #191919; --panel-2: #212121; --inset: #141414; --line: #242424; --line-2: #303030;
      --text: #f4f4f4; --muted: #9b9b9b; --dim: #686868; --accent: #7ee06c; --accent-2: #a9f29a; --down: #f2555a;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      font-family: var(--sans); color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; color: var(--text); font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      background: radial-gradient(1100px 700px at 50% -20%, #1c1c1c, var(--page) 60%) fixed, var(--page); }
    main { width: min(720px, 100%); margin: 0 auto; padding: 48px 16px 80px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -0.02em; }
    .brand svg { width: 18px; height: 18px; color: var(--accent); }
    h1 { margin: 28px 0 6px; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; }
    .sub { margin: 0 0 26px; color: var(--muted); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    .card + .card { margin-top: 14px; }
    .card h2 { margin: 0 0 14px; font-size: 14.5px; font-weight: 600; }
    .seg { display: inline-flex; gap: 2px; padding: 3.5px; border-radius: 12px; background: #161616; border: 1px solid var(--line); margin-bottom: 14px; }
    .seg button { height: 32px; padding: 0 14px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--muted); font: 500 13px var(--sans); cursor: pointer; }
    .seg button[aria-pressed=true] { color: var(--text); background: var(--panel-2); border-color: #2c2c2c; }
    .row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
    input { height: 42px; width: 100%; padding: 0 14px; border-radius: 10.5px; border: 1px solid var(--line-2); background: var(--inset); color: var(--text); font: 14px var(--sans); outline: none; }
    input:focus { border-color: #4a4a4a; }
    input::placeholder { color: var(--dim); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; padding: 0 18px; border-radius: 10.5px; border: 1px solid var(--accent); background: var(--accent); color: #0b0b0b; font: 600 13.5px var(--sans); cursor: pointer; white-space: nowrap; }
    .btn:hover { background: var(--accent-2); }
    .btn[disabled] { opacity: 0.5; cursor: wait; }
    .btn.ghost { background: var(--panel-2); border-color: var(--line-2); color: var(--text); font-weight: 500; height: 32px; padding: 0 12px; font-size: 12.5px; }
    .btn.ghost:hover { border-color: #3a3a3a; }
    .hint { margin: 10px 0 0; color: var(--dim); font-size: 12.5px; }
    .hint b { color: var(--muted); font-weight: 500; }
    .msg { margin: 10px 0 0; font-size: 12.5px; color: var(--down); }
    .msg.ok { color: var(--accent); }
    .share { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10.5px; background: var(--inset); border: 1px solid var(--line); }
    .share code { flex: 1; min-width: 0; font: 12.5px var(--mono); color: var(--text); overflow-wrap: anywhere; }
    .list { display: grid; }
    .item { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; padding-top: 0; }
    .who b { display: block; font-weight: 600; font-size: 14px; }
    .who small { color: var(--dim); font-size: 12px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted); }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.joined { color: var(--accent); border-color: rgb(126 224 108 / 0.35); background: rgb(126 224 108 / 0.06); }
    .empty { color: var(--dim); text-align: center; padding: 18px 0 4px; }
    .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 14px; }
    .head h2 { margin: 0; }
    .count { color: var(--dim); font-size: 12.5px; }
    @media (max-width: 600px) {
      main { padding-top: 28px; }
      .row { grid-template-columns: 1fr; }
      .item { grid-template-columns: 1fr auto; }
      .item .badge { grid-column: 1; justify-self: start; }
      .item .btn { grid-row: 1 / span 2; grid-column: 2; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 13.5h6.5L9 22l10-12h-6.6L13.5 2z"/></svg>Swordfish</div>
    <h1>Invite people</h1>
    <p class="sub">Add someone's Telegram username or phone number. Access works straight away, no restart.</p>

    <form class="card" id="form">
      <h2>New invite</h2>
      <div class="seg" role="group" aria-label="Invite by">
        <button type="button" data-kind="username" aria-pressed="true">Telegram username</button>
        <button type="button" data-kind="phone" aria-pressed="false">Phone number</button>
      </div>
      <div class="row">
        <input id="value" name="value" autocomplete="off" required placeholder="@username">
        <input id="note" name="note" autocomplete="off" maxlength="80" placeholder="Name or note (optional)">
        <button class="btn" id="add" type="submit">Add invite</button>
      </div>
      <p class="hint" id="hint"></p>
      <p class="msg" id="msg" hidden></p>
    </form>

    <div class="card">
      <h2>Send them this</h2>
      <div class="share"><code id="share">Loading…</code><button class="btn ghost" id="copy" type="button">Copy</button></div>
      <p class="hint">When they press <b>Start</b>, the bot creates their account and wallet.</p>
    </div>

    <div class="card">
      <div class="head"><h2>Invited</h2><span class="count" id="count"></span></div>
      <div class="list" id="list"></div>
    </div>
  </main>

  <script>
    const api = location.pathname.replace(/^\/invite\//, '/api/invite/').replace(/\/$/, '')
    const $ = (s) => document.querySelector(s)
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
    const HINTS = {
      username: { placeholder: '@username', hint: 'Their Telegram username, found under <b>Settings → Username</b> in Telegram.' },
      phone: { placeholder: '+60 12 345 6789', hint: 'The number on their Telegram account, ideally with the country code. They tap <b>📱 Share my phone number</b> in the bot once to confirm it.' },
    }
    let kind = 'username'

    function setKind(next) {
      kind = next
      document.querySelectorAll('[data-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === kind)))
      $('#value').placeholder = HINTS[kind].placeholder
      $('#value').inputMode = kind === 'phone' ? 'tel' : 'text'
      $('#hint').innerHTML = HINTS[kind].hint
      $('#value').focus()
    }
    document.querySelectorAll('[data-kind]').forEach((b) => b.addEventListener('click', () => setKind(b.dataset.kind)))

    function say(text, ok = false) {
      $('#msg').hidden = !text
      $('#msg').textContent = text
      $('#msg').className = ok ? 'msg ok' : 'msg'
    }

    const when = (iso) => new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })
    function render({ bot, operators, invites }) {
      $('#share').textContent = bot ? `You're invited to Swordfish. Open https://t.me/${bot} and press Start.` : 'The Telegram bot is offline right now.'
      $('#count').textContent = `${invites.length} invited · ${invites.filter((i) => i.joinedAt).length} joined${operators ? ` · ${operators} owner account${operators > 1 ? 's' : ''} in server config` : ''}`
      $('#list').innerHTML = invites.length
        ? invites.map((i) => `<div class="item">
            <div class="who"><b>${i.kind === 'phone' ? `+${esc(i.value)}` : `@${esc(i.value)}`}</b><small>${esc(i.note || (i.kind === 'phone' ? 'Phone number' : 'Username'))} · added ${when(i.createdAt)}</small></div>
            <span class="badge ${i.joinedAt ? 'joined' : ''}">${i.joinedAt ? `Joined${i.joinedAs ? ` as @${esc(i.joinedAs)}` : ''}` : 'Waiting'}</span>
            <button class="btn ghost" type="button" data-remove="${i.id}">Remove</button>
          </div>`).join('')
        : '<p class="empty">No one invited yet.</p>'
    }

    async function call(path, body) {
      const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {})
      const data = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`)
      return data
    }

    $('#form').addEventListener('submit', async (e) => {
      e.preventDefault()
      $('#add').disabled = true
      try {
        render(await call(api, { kind, value: $('#value').value, note: $('#note').value }))
        say(`Invited ${kind === 'phone' ? 'that number' : `@${$('#value').value.replace(/^@/, '')}`}. Send them the message below.`, true)
        $('#value').value = ''
        $('#note').value = ''
      } catch (err) {
        say(err.message)
      } finally {
        $('#add').disabled = false
      }
    })

    $('#list').addEventListener('click', async (e) => {
      const id = e.target.closest('[data-remove]')?.dataset.remove
      if (!id || !confirm('Remove this invite? If they already joined, they lose access to the bot and dashboard.')) return
      try {
        render(await call(`${api}/remove`, { id: Number(id) }))
        say('Invite removed.', true)
      } catch (err) {
        say(err.message)
      }
    })

    $('#copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText($('#share').textContent)
        $('#copy').textContent = 'Copied'
      } catch {
        getSelection().selectAllChildren($('#share'))
        $('#copy').textContent = 'Press ⌘C'
      }
      setTimeout(() => ($('#copy').textContent = 'Copy'), 1600)
    })

    setKind('username')
    call(api).then(render).catch((err) => say(err.message))
  </script>
</body>
</html>
